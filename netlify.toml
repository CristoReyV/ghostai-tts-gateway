[build]
  publish = "public"
  functions = "netlify/functions"

# ─── Health endpoints ───────────────────────────────────────────────────────
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# ─── TTS Gateway endpoints ──────────────────────────────────────────────────
[[redirects]]
  from = "/api/tts/generate"
  to = "/.netlify/functions/tts-generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/voices"
  to = "/.netlify/functions/tts-voices"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/models"
  to = "/.netlify/functions/tts-models"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/voice-library"
  to = "/.netlify/functions/tts-voice-library"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/voices/shared/add"
  to = "/.netlify/functions/tts-voices-shared-add"
  status = 200
  force = true

# ─── Operator Auth endpoints ────────────────────────────────────────────────
[[redirects]]
  from = "/api/tts/auth/verify"
  to = "/.netlify/functions/tts-auth-verify"
  status = 200
  force = true

# ─── Admin endpoints ────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/admin/clients"
  to = "/.netlify/functions/admin-clients"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/access-tokens"
  to = "/.netlify/functions/admin-access-tokens"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/access-tokens/revoke"
  to = "/.netlify/functions/admin-access-tokens-revoke"
  status = 200
  force = true

# ─── BYOK Provider endpoints ────────────────────────────────────────────────
[[redirects]]
  from = "/api/tts/provider/elevenlabs/connect"
  to = "/.netlify/functions/tts-provider-elevenlabs-connect"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/provider/elevenlabs/status"
  to = "/.netlify/functions/tts-provider-elevenlabs-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/provider/elevenlabs/disconnect"
  to = "/.netlify/functions/tts-provider-elevenlabs-disconnect"
  status = 200
  force = true


# ─── Legacy stub (kept for backwards-compat, now a GET info endpoint) ───────
[[redirects]]
  from = "/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# ─── Global headers ─────────────────────────────────────────────────────────
# NOTE: Fine-grained CORS (GHOSTAI_ALLOWED_ORIGINS) is handled inside each
# function. These headers are a safe baseline for static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-GhostAI-Gateway = "true"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
