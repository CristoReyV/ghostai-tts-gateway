[build]
  publish = "public"
  functions = "netlify/functions"

# ─── Scheduled Functions ──────────────────────────────────────────────────────
[functions."cleanup-tts-generations"]
  schedule = "@hourly"

# ─── Health endpoints ───────────────────────────────────────────────────────
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# ─── TTS Gateway endpoints ──────────────────────────────────────────────────
[[redirects]]
  from = "/api/tts/generate"
  to = "/.netlify/functions/tts-generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts/voices"
