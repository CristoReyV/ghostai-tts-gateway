# ─── Legacy stub (kept for backwards-compat, now a GET info endpoint) ───────
[[redirects]]
  from = "/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# ─── Global headers ─────────────────────────────────────────────────────────
# NOTE: Fine-grained CORS (GHOSTAI_ALLOWED_ORIGINS) is handled inside each
# function. These headers are a safe baseline for static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-GhostAI-Gateway = "true"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
